<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>یاسین کولیوند | طراح گرافیک</title>
    
    <!-- فونت وزیر متن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- آیکون‌های متریال -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- کتابخانه انیمیشن (جایگزین Fade) -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* تنظیمات کلی و متغیرها (تم دارک) */
        :root {
            --primary: #BB86FC;
            --secondary: #03DAC6;
            --background: #121212;
            --paper: #1E1E1E;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --divider: rgba(255, 255, 255, 0.12);
            --font-family: 'Vazirmatn', Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--background);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }

        /* نوبار (AppBar) */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--divider);
            padding: 10px 0;
            height: 64px;
            display: flex;
            align-items: center;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
        }

        .nav-content {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .desktop-menu {
            display: flex;
        }

        .nav-link {
            color: var(--text-primary);
            margin: 0 15px;
            cursor: pointer;
            font-weight: 500;
            transition: color 0.3s;
            font-size: 1rem;
        }

        .nav-link:hover {
            color: var(--primary);
        }

        /* موبایل منو */
        .mobile-header {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .menu-icon {
            cursor: pointer;
            color: var(--text-primary);
        }

        .drawer {
            position: fixed;
            top: 0;
            left: 0; /* سمت چپ باز شود */
            width: 240px;
            height: 100%;
            background-color: var(--background);
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1200;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .drawer.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--divider);
            padding-bottom: 10px;
        }

        .drawer-link {
            padding: 15px 0;
            display: block;
            text-align: center;
            color: var(--text-primary);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1100;
            display: none;
        }

        .overlay.open { display: block; }

        /* بخش‌ها (Sections) */
        section {
            padding: 80px 16px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .section-title {
            font-size: 2.125rem;
            margin-bottom: 40px;
            position: relative;
            font-weight: 600;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 4px;
            background-color: var(--primary);
            margin: 10px auto 0;
            border-radius: 2px;
        }

        /* Hero Section */
        #home {
            min-height: 100vh;
            background-image: radial-gradient(circle, rgba(187, 134, 252, 0.1) 0%, rgba(18, 18, 18, 0) 60%);
            padding-top: 64px; 
        }

        .hero-name { font-size: 3rem; font-weight: 700; margin-bottom: 0.35em; }
        .hero-title { font-size: 1.5rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 0.35em; }
        .hero-bio { max-width: 600px; margin-top: 24px; font-size: 1rem; line-height: 1.5; }

        /* About */
        .about-text {
            color: var(--text-secondary);
            white-space: pre-line;
            text-align: justify;
            max-width: 900px;
            line-height: 1.8;
        }

        /* Portfolio Images */
        .portfolio-wrapper {
            width: 100%;
            max-width: 900px;
            margin-bottom: 48px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            transition: transform 0.3s ease-in-out;
        }

        .portfolio-wrapper:hover {
            transform: scale(1.02);
        }

        .portfolio-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Skills */
        .skills-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            max-width: 900px;
        }

        .chip {
            border: 1px solid var(--primary);
            color: var(--primary);
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Experience */
        .experience-grid {
            display: flex;
            flex-direction: column;
            gap: 32px;
            max-width: 900px;
            width: 100%;
        }

        .experience-card {
            text-align: right;
            padding: 24px;
            border-right: 3px solid var(--primary);
            background: rgba(255,255,255,0.05);
            border-radius: 0 8px 8px 0;
        }

        .exp-role { font-size: 1.25rem; font-weight: 500; margin-bottom: 4px; }
        .exp-company { color: var(--primary); margin-bottom: 8px; font-size: 1rem; }
        .exp-desc { color: var(--text-secondary); font-size: 0.875rem; }

        /* Contact */
        .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 32px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .contact-item .material-icons {
            margin-left: 8px;
            color: var(--primary);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .social-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            transition: color 0.3s;
        }
        
        .social-btn:hover { color: var(--primary); }

        /* Footer */
        footer {
            padding: 32px;
            background-color: var(--paper);
            text-align: center;
            border-top: 1px solid var(--divider);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Responsive Media Queries */
        @media (max-width: 900px) {
            .desktop-menu { display: none; }
            .mobile-header { display: flex; }
            .nav-content { justify-content: space-between; }
            
            .hero-name { font-size: 2.5rem; }
            section { padding: 64px 16px; }
        }
    </style>
</head>
<body>

    <!-- نوبار -->
    <header>
        <div class="container">
            <div class="nav-content">
                
                <!-- منوی دسکتاپ -->
                <nav class="desktop-menu">
                    <a href="#home" class="nav-link">خانه</a>
                    <a href="#about" class="nav-link">درباره من</a>
                    <a href="#portfolio" class="nav-link">نمونه کار</a>
                    <a href="#skills" class="nav-link">مهارت‌ها</a>
                    <a href="#experience" class="nav-link">سوابق</a>
                    <a href="#contact" class="nav-link">تماس با من</a>
                </nav>

                <!-- هدر موبایل -->
                <div class="mobile-header">
                    <span id="mobile-title" style="font-size: 1.25rem; font-weight: 500;"></span>
                    <i class="material-icons menu-icon" onclick="toggleDrawer()">menu</i>
                </div>
            </div>
        </div>
    </header>

    <!-- منوی کشویی موبایل -->
    <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-header">
            <span style="font-size: 1.25rem;">منو</span>
            <i class="material-icons menu-icon" onclick="toggleDrawer()">close</i>
        </div>
        <nav>
            <a href="#home" class="drawer-link" onclick="toggleDrawer()">خانه</a>
            <a href="#about" class="drawer-link" onclick="toggleDrawer()">درباره من</a>
            <a href="#portfolio" class="drawer-link" onclick="toggleDrawer()">نمونه کار</a>
            <a href="#skills" class="drawer-link" onclick="toggleDrawer()">مهارت‌ها</a>
            <a href="#experience" class="drawer-link" onclick="toggleDrawer()">سوابق</a>
            <a href="#contact" class="drawer-link" onclick="toggleDrawer()">تماس با من</a>
        </nav>
    </div>

    <!-- محتوا -->
    <main class="container">
        
        <!-- خانه -->
        <section id="home">
            <div data-aos="fade-down">
                <h1 class="hero-name" id="personal-name"></h1>
                <h2 class="hero-title" id="personal-title"></h2>
                <p class="hero-bio" id="personal-bio"></p>
            </div>
        </section>

        <!-- درباره من -->
        <section id="about">
            <div data-aos="fade-up">
                <h4 class="section-title">درباره من</h4>
                <p class="about-text" id="about-content"></p>
            </div>
        </section>

        <!-- نمونه کارها -->
        <section id="portfolio">
            <h4 class="section-title">نمونه کارها</h4>
            <div id="portfolio-list" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
                <!-- تصاویر توسط JS پر می‌شوند -->
            </div>
        </section>

        <!-- مهارت‌ها -->
        <section id="skills">
            <div data-aos="fade-up">
                <h4 class="section-title">مهارت‌ها</h4>
                <div class="skills-container" id="skills-list"></div>
            </div>
        </section>

        <!-- سوابق شغلی -->
        <section id="experience">
            <h4 class="section-title">سوابق شغلی</h4>
            <div class="experience-grid" id="experience-list"></div>
        </section>

        <!-- تماس با من -->
        <section id="contact">
            <div data-aos="fade-up">
                <h4 class="section-title">تماس با من</h4>
                <p style="color: var(--text-secondary); margin-bottom: 32px;">
                    برای همکاری یا صحبت در مورد پروژه‌های خلاقانه، با من در ارتباط باشید.
                </p>
                <div class="contact-info">
                    <div class="contact-item">
                        <i class="material-icons">email</i>
                        <span id="contact-email"></span>
                    </div>
                    <div class="contact-item">
                        <i class="material-icons">phone</i>
                        <span id="contact-phone"></span>
                    </div>
                </div>
                <div class="social-icons">
                    <a id="link-linkedin" target="_blank" class="social-btn">
                        <!-- SVG LinkedIn for simplicity or use Material Icon alternative -->
                        <svg style="width:24px;height:24px" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M19 3A2 2 0 0 1 21 5V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H19M18.5 18.5V13.2A3.26 3.26 0 0 0 15.24 9.94C14.39 9.94 13.4 10.46 12.92 11.24V10.13H10.13V18.5H12.92V13.57C12.92 12.8 13.54 12.17 14.31 12.17A1.4 1.4 0 0 1 15.71 13.57V18.5H18.5M6.88 8.56A1.68 1.68 0 0 0 8.56 6.88C8.56 5.95 7.81 5.19 6.88 5.19A1.69 1.69 0 0 0 5.19 6.88C5.19 7.81 5.95 8.56 6.88 8.56M8.27 18.5V10.13H5.5V18.5H8.27Z" />
                        </svg>
                    </a>
                    <a id="link-instagram" target="_blank" class="social-btn">
                        <svg style="width:24px;height:24px" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M7.8,2H16.2C19.4,2 22,4.6 22,7.8V16.2A5.8,5.8 0 0,1 16.2,22H7.8C4.6,22 2,19.4 2,16.2V7.8A5.8,5.8 0 0,1 7.8,2M7.6,4A3.6,3.6 0 0,0 4,7.6V16.4C4,18.39 5.61,20 7.6,20H16.4A3.6,3.6 0 0,0 20,16.4V7.6C20,5.61 18.39,4 16.4,4H7.6M17.25,5.5A1.25,1.25 0 0,1 18.5,6.75A1.25,1.25 0 0,1 17.25,8A1.25,1.25 0 0,1 16,6.75A1.25,1.25 0 0,1 17.25,5.5M12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9Z" />
                        </svg>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- فوتر -->
    <footer>
        <p id="footer-text"></p>
    </footer>

    <!-- اسکریپت‌ها -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        // 1. داده‌ها (استخراج شده از کد React)
        const portfolioData = {
            personalInfo: {
                name: 'یاسین کولیوند',
                title: 'طراح گرافیک | UI/UX Designer',
                bio: 'یک طراح گرافیک خلاق و جزئی‌نگر با بیش از 2 سال تجربه در زمینه طراحی هویت بصری، رابط کاربری و کمپین‌های تبلیغاتی. علاقه‌مند به خلق تجربه‌های بصری ماندگار و تاثیرگذار.',
                email: 'yasin123123ys1@gmail.com', // کاما به نقطه اصلاح شد
                phone: '09927953211',
                socials: {
                    linkedin: 'https://linkedin.com/in/yourprofile',
                    instagram: 'https://instagram.com/yourprofile',
                },
            },
            aboutMe: `من از سال 1402 به صورت حرفه‌ای وارد دنیای گرافیک شدم و همیشه به دنبال یادگیری تکنیک‌های جدید و به‌روز نگه داشتن خودم هستم. توانایی کار با نرم‌افزارهای خانواده Adobe را به صورت کامل دارم و به اصول تایپوگرافی، رنگ‌شناسی و ترکیب‌بندی مسلط هستم. در پروژه‌های مختلفی از طراحی لوگو و برندبوک گرفته تا طراحی پوستر و بنر. هدف من تبدیل ایده‌های خام به واقعیت‌های بصری زیبا و کارآمد است.`,
            skills: [
                'Adobe Photoshop', 'Adobe Illustrator', 'Figma', 'UI/UX Design', 'Branding', 'Typography', 'Logo Design', 'Social Media Content'
            ],
            experience: [
                {
                    role: 'طراح گرافیک ',
                    company: 'شرکت مرغ سالم',
                    description: 'طراحی بنرهای تبلیغاتی، مدیریت هویت بصری برند، طراحی کمپین‌ها.'
                },
                {
                    role: 'طراح گرافیک',
                    company: 'پیج pixory',
                    description: 'طراحی بنرهای تبلیغاتی، مدیریت هویت بصری برند، طراحی کمپین‌ها.'
                }
            ],
        };
        const portfolioItems = [
            { title: 'پروژه طراحی هویت بصری', description: 'طراحی لوگو و برندبوک برای یک استارتاپ در حوزه فین‌تک', imgId: 1 },
            { title: 'کمپین تبلیغاتی اینستاگرام', description: 'طراحی پست و استوری برای کمپین فصل پاییز', imgId: 2 },
        ];
        for(let i=3; i<=35; i++) {
            portfolioItems.push({
                title: 'طراحی رابط کاربری اپلیکیشن',
                description: 'طراحی کامل UI/UX یک اپلیکیشن سفارش آنلاین غذا',
                imgId: i
            });
        }
        portfolioData.portfolio = portfolioItems;

        document.addEventListener('DOMContentLoaded', () => {
            
            AOS.init({
                duration: 1000,
                once: true,
            });
            document.getElementById('personal-name').textContent = portfolioData.personalInfo.name;
            document.getElementById('mobile-title').textContent = portfolioData.personalInfo.name;
            document.getElementById('personal-title').textContent = portfolioData.personalInfo.title;
            document.getElementById('personal-bio').textContent = portfolioData.personalInfo.bio;
            document.getElementById('about-content').textContent = portfolioData.aboutMe;

            // اطلاعات تماس
            document.getElementById('contact-email').textContent = portfolioData.personalInfo.email;
            document.getElementById('contact-phone').textContent = portfolioData.personalInfo.phone;
            document.getElementById('link-linkedin').href = portfolioData.personalInfo.socials.linkedin;
            document.getElementById('link-instagram').href = portfolioData.personalInfo.socials.instagram;

            // فوتر
            document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} - تمامی حقوق برای ${portfolioData.personalInfo.name} محفوظ است.`;

            // رندر لیست مهارت‌ها
            const skillsContainer = document.getElementById('skills-list');
            portfolioData.skills.forEach(skill => {
                const span = document.createElement('span');
                span.className = 'chip';
                span.textContent = skill;
                skillsContainer.appendChild(span);
            });

            // رندر لیست سوابق
            const expContainer = document.getElementById('experience-list');
            portfolioData.experience.forEach(job => {
                const div = document.createElement('div');
                div.className = 'experience-card';
                div.setAttribute('data-aos', 'fade-up');
                div.innerHTML = `
                    <div class="exp-role">${job.role}</div>
                    <div class="exp-company">${job.company}</div>
                    <div class="exp-desc">${job.description}</div>
                `;
                expContainer.appendChild(div);
            });

            // رندر لیست نمونه کارها (تصاویر)
            const portContainer = document.getElementById('portfolio-list');
            portfolioData.portfolio.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'portfolio-wrapper';
                wrapper.setAttribute('data-aos', 'fade-up');
                // نکته: مسیر عکس‌ها را اینجا تنظیم می‌کنیم
                // اگر عکس‌ها در پوشه assets/images هستند:
                const imgSrc = `./assets/images/image${item.imgId}.jpg`;
                
                wrapper.innerHTML = `
                    <img src="${imgSrc}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'; console.log('Image not found:', '${imgSrc}')">
                `;
                portContainer.appendChild(wrapper);
            });
        });

        // 3. منطق منوی موبایل
        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            const overlay = document.getElementById('overlay');
            drawer.classList.toggle('open');
            overlay.classList.toggle('open');
        }

    </script>
</body>
</html>
